spring.application.name=core

spring.datasource.driver-class-name=org.postgresql.Driver
spring.mvc.async.request-timeout=300000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

cardmarket.base-url=https://www.cardmarket.com/en

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.devtools.restart.trigger-file=.reload

app.cors.allowed-origins=http://localhost,http://localhost:4200,https://consistently-organ-pan-southeast.trycloudflare.com

jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES
jwt.expiration-ms=86400000